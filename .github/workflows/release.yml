# Al publicar un release arma el instalador de Windows y lo cuelga del mismo release.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release al que se le sube el instalador (ej. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  instalador:
    runs-on: ubuntu-latest
    steps:
      - name: Etiqueta
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas
        run: |
          python -m pip install -q -r requirements.txt pytest httpx
          python -m pytest -q
      - name: NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Instalador
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install -q packaging
          bash packaging/build_win.sh "${{ steps.tag.outputs.tag }}"
      - name: Subir al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" packaging/build/AlignerTrimlineSetup-*.exe --clobber
